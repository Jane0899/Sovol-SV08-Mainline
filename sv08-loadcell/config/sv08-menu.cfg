# sv08-loadcell: Display-Menü-Anpassungen (Symlink ins Repo - kommt mit Updates)
# Gleichnamige [menu ...]-Sektionen überschreiben das eingebaute klipper/klippy/extras/display/menu.cfg,
# so bleibt Klipper selbst unverändert (Mainline).

[menu __main __filament __loadf]
type: command
name: Load Fil. fast
gcode: LOAD_FILAMENT_FAST

[menu __main __filament __loads]
type: command
name: Load Fil. slow
gcode: LOAD_FILAMENT_SLOW

[menu __main __filament __unloadf]
type: command
name: Unload Fil.fast
gcode: UNLOAD_FILAMENT_FAST

[menu __main __filament __unloads]
type: command
name: Unload Fil.slow
gcode: UNLOAD_FILAMENT_SLOW
