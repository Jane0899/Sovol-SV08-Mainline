# sv08-loadcell: Z-Homing auf der Wägezelle + automatischer Z-Offset
# Symlink ins Repo (~/Sovol-SV08-Mainline/sv08-loadcell) - kommt mit Updates, hier nichts ändern.
# Eigene Werte in printer.cfg unter [sv08_loadcell]
# Absichtlich ohne Werte: Optionen in eingebundenen Dateien kollidieren mit SAVE_CONFIG
# ("conflicts with included value"). Die Standardwerte stehen im Modul (sv08_loadcell.py),
# gemessene Werte schreibt SV08_CALIBRATE in den SAVE_CONFIG-Block von printer.cfg.
# Mögliche Optionen (Standard):
#   loadcell_xy_position: 289,361  Düsenposition über der Wägezelle
#   bed_xy_position:               Probe-Position am Bett für AUTO_Z_OFFSET (Standard: [bed_mesh] zero_reference_position)
#   coarse_speed: 30               Grobannäherung mit der induktiven Probe (mm/s)
#   home_speed: 0.1                Feinannäherung der Düse auf die Zelle (Streuung ~ v x 80 ms)
#   home_clearance: 0.2            Startabstand der Feinannäherung über dem erwarteten Kontakt
#   probe_contact_gap: 0.05        Abstand Probe-Auslösehöhe über der Zelle -> Düsenkontakt (bewusst klein)
#   max_slow_travel: 1.5           maximale Strecke der Feinannäherung
#   z_correction: 0                Korrektur Zelle/PEI (Papiertest)
#   max_offset: 1.0                AUTO_Z_OFFSET bricht bei größerem Offset ab

# Bewegen ohne bekannte Position (Sicherheitshub vor dem Homing)
[force_move]
enable_force_move: True

[homing_override]
axes: xyz
gcode:
    # Achsen aus allen Parameternamen sammeln, damit auch G28XY (= ein Parameter "XY") funktioniert
    {% set axes = params|join|upper %}
    {% set home_all = 'X' not in axes and 'Y' not in axes and 'Z' not in axes %}

    # Sicherheitshub, falls Z nicht bekannt ist
    {% if home_all or 'Z' in axes %}
        G90
        SET_KINEMATIC_POSITION Z=0
        G1 Z10 F1200
    {% endif %}

    # Y und X vorne bzw. links homen (auf 0): hinten liegen die Anschläge ungünstig nahe an den
    # Riemen, dort verliert man beim sensorlosen Homing Schritte
    {% if home_all or 'Y' in axes %}
        G28 Y
        G91
        G1 Y2 F3000
        G90
        M400
    {% endif %}

    {% if home_all or 'X' in axes %}
        G28 X
        G91
        G1 X2 F3000
        G90
        M400
    {% endif %}

    # Z: induktive Probe grob über der Wägezelle, dann Düse ganz langsam auf die Zelle
    {% if home_all or 'Z' in axes %}
        G90
        LOADCELL_HOME
        G1 Z10 F1200
    {% endif %}
