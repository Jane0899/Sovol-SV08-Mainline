# sv08-loadcell: Makros (Symlink ins Repo - kommt mit Updates, hier nichts ändern;
# eigene Makros/Overrides in printer.cfg oder einer eigenen Datei)

#####################################################################
#   LED Macros
#####################################################################

[gcode_macro mainled_on]
gcode:
    {% if 'output_pin main_led' in printer.configfile.settings %}
        SET_PIN PIN=main_led VALUE=1
    {% endif %}

[gcode_macro mainled_off]
gcode:
    {% if 'output_pin main_led' in printer.configfile.settings %}
        SET_PIN PIN=main_led VALUE=0
    {% endif %}

#####################################################################
#   Print Start & End Logic
#####################################################################

[gcode_macro START_PRINT]
description: Optimiertes Start-Makro (Home -> Heat -> Clean -> Z-Offset -> Mesh)
gcode:
    # --- Parameter & Defaults ---
    {% set bedtemp = params.BED_TEMP|default(60)|int %}
    {% set hotendtemp = params.EXTRUDER_TEMP|default(230)|int %}
    {% set heatsoak = params.HEATSOAK|default(False) %}
    {% set heatsoak_time = params.SOAKTIME|default(15)|int %}
    {% set extruder_preheat = 150 %}
    
    # --- Vorbereitung ---
    M400
    CLEAR_PAUSE
    G90
    mainled_on
    
    # --- 1. Sicherheit: Filament Check (DEAKTIVIERT) ---
    # {% if printer['filament_switch_sensor filament_sensor'].enabled == True and printer['filament_switch_sensor filament_sensor'].filament_detected != True %}
    #      M117 KEIN FILAMENT!
    #      CANCEL_PRINT
    # {% endif %}

    # --- 2. Aufheizen (Start) ---
    M117 Heize Bett & Vorwärmen...
    M140 S{bedtemp}            ; Bett heizen (nicht warten)
    M104 S{extruder_preheat}   ; Düse 150 (nicht warten)

    # --- 3. Homing ---
    M117 Homing...
    _CG28

    # --- 4. Heatsoak Logik ---
    # WICHTIG: Das Bett MUSS heiß sein vor QGL und Mesh!
    {% if heatsoak %}
        M117 Heatsoak: Düse kühlen...
        M104 S90
        M117 Warte auf Bettziel...
        M190 S{bedtemp}        ; Warten!
        M117 Heatsoak für {heatsoak_time} min...
        G4 P{heatsoak_time * 60000}
        M104 S{extruder_preheat}
    {% endif %}

    # --- 5. QGL & Clean ---
    M117 QGL...
    _CQUAD_GANTRY_LEVEL
    
    M117 Düse reinigen...
    CLEAN_NOZZLE

    # --- 6. Mesh ---
    M117 Adaptive Mesh...
    m190s{bedtemp}
    BED_MESH_CALIBRATE ADAPTIVE=1

    # --- 7. Finales Heizen ---
    # Düse VOR dem Auto Z-Offset auf Drucktemperatur: sie dehnt sich ~0,0015 mm/K aus
    M117 Finales Aufheizen...
    G1 X344 Y364 Z10 F9000      
    M140 S{bedtemp}
    M109 S{hotendtemp}         ; Warten auf Drucktemperatur

    # --- 8. Auto Z-Offset ---
    # Düse sauber und auf Drucktemperatur -> messen (setzt SET_GCODE_OFFSET Z, s. AUTO_Z_OFFSET)
    M117 Auto Z-Offset...
    AUTO_Z_OFFSET

    # --- 9. Start ---
    M117 Druck startet...
    {action_respond_info("Druck gestartet!")}

[gcode_macro END_PRINT]
description: Sauberer End-Code
gcode:
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% set e_mintemp = printer.configfile.settings['extruder'].min_extrude_temp %}

    M400
    M117 Druck fertig.
    G91
    
    # Retract
    {% if printer.extruder.temperature >= e_mintemp %}
        G1 E-2 F2700
        G1 E-2 Z0.2 F2400
    {% else %}
        G1 Z0.2 F2400
    {% endif %}

    # Safe Z-Hop
    {% if act_z < (max_z - 25.0) %}
        G1 Z25 F3000
    {% else %}
        G1 Z{max_z - act_z} F3000
    {% endif %}
    
    G90
    G0 X344 Y364 F9000

    TURN_OFF_HEATERS
    _ALL_FAN_OFF
    # Motoren bleiben an, Abschaltung erfolgt über _IDLE_TIMEOUT (10 min)
    M220 S100
    M221 S100
    CLEAR_PAUSE
    {action_respond_info("Finish Print!")}

[gcode_macro _IDLE_TIMEOUT]
description: Wird von [idle_timeout] nach 10 min Inaktivität aufgerufen
gcode:
    {% if printer.print_stats.state == "paused" %}
      RESPOND TYPE=echo MSG="No operations in 10min!"
    {% else %}
      M84
      TURN_OFF_HEATERS
    {% endif %}

[gcode_macro CANCEL_PRINT]
description: Abbruch mit Sicherheitschecks (nur bewegen wenn gehomed)
rename_existing: CANCEL_PRINT_BASE
gcode:
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% set e_mintemp = printer.configfile.settings['extruder'].min_extrude_temp %}

    CANCEL_PRINT_BASE
    M117 Abbruch...
    
    # Sicherheit: Nur bewegen wenn gehomed!
    {% if "xyz" in printer.toolhead.homed_axes %}
        G91
        {% if printer.extruder.temperature >= e_mintemp %}
            G1 E-2 F2700
            G1 E-2 Z1 F2400
        {% endif %}

        {% if act_z < (max_z - 20) %}
            G1 Z20 F3000
        {% else %}
            G1 Z{max_z - act_z} F3000
        {% endif %}
        
        G90
        G0 X344 Y364 F9000
    {% else %}
        M117 Abbruch (Kein Homing - keine Bewegung).
    {% endif %}

    TURN_OFF_HEATERS
    _ALL_FAN_OFF
    # Motoren bleiben an, Abschaltung erfolgt über _IDLE_TIMEOUT (10 min)
    CLEAR_PAUSE
    M117 Abbruch erledigt.

#####################################################################
#   Helpers & Calibration
#####################################################################

[gcode_macro CENTER]
gcode:
    G0 X175 Y175 F5000

[gcode_macro _CG28]
description: Conditional G28 - homt nur Achsen, die noch nicht gehomed sind (AXES=XYZ Standard)
gcode:
    {% set axes = params.AXES|default("XYZ")|upper %}
    {% set homed = printer.toolhead.homed_axes|upper %}
    {% set todo = [] %}
    {% for a in "XYZ" if a in axes and a not in homed %}
        {% set _dummy = todo.append(a) %}
    {% endfor %}
    {% if todo|length == 3 %}
        G28
    {% elif todo|length > 0 %}
        G28 {todo|join(" ")}
    {% endif %}

[gcode_macro _CQUAD_GANTRY_LEVEL]
description: Conditional QGL - nur wenn noch nicht ausgeführt (wird bei Motoren-Aus zurückgesetzt)
gcode:
    {% if printer.quad_gantry_level.applied|lower != 'true' %}
        _CG28
        QUAD_GANTRY_LEVEL
        # Nach QGL Z zwingend neu homen (bewusst unbedingtes G28)
        G28 Z
    {% endif %}

[gcode_macro CLEAN_NOZZLE]
description: Heizen auf 260 -> Wischen -> Abkühlen lassen -> sauber neu homen. MAX_AGE=s: überspringen, wenn so kurz vorher schon gereinigt (Standard 120)
# Zeitpunkt der letzten Reinigung (toolhead.estimated_print_time), -1 = seit dem Klipper-Start noch nie.
# LOADCELL_HOME reinigt dann vor dem ersten Homing automatisch.
variable_last_clean: -1
gcode:
    # Ohne Homing kein Cleaning. Das erste Homing nach dem Start reinigt dabei schon selbst
    _CG28
    _CLEAN_NOZZLE_RUN MAX_AGE={params.MAX_AGE|default(120)}

[gcode_macro _CLEAN_NOZZLE_RUN]
gcode:
    {% set last = printer["gcode_macro CLEAN_NOZZLE"].last_clean|float %}
    {% set age = printer.toolhead.estimated_print_time - last %}
    {% if last >= 0 and age < params.MAX_AGE|float %}
        RESPOND MSG="CLEAN_NOZZLE: vor {age|int} s gereinigt, übersprungen"
    {% else %}
        _CLEAN_NOZZLE_WIPE
    {% endif %}

[gcode_macro _CLEAN_NOZZLE_WIPE]
description: PASSES=n Wischdurchgänge à 10 Striche (LOADCELL_HOME nimmt 2, wenn es Filament an der Düse findet)
# Wischhöhe über Z0. Tiefer = Düse weiter in der Bürste. Sovol nimmt 0,5, das bekam PETG-Reste
# am Referenzgerät nicht ab (0,4 und 0,3 auch nicht), 0,2 schon - 0,1 mit Reserve
variable_wipe_z: 0.1
gcode:
    {% set old_target = printer.extruder.target|int %}
    {% set passes = params.PASSES|default(1)|int %}

    M117 Cleaning: Heizen auf 260C...
    M109 S260
    # 1 mm zurückziehen: sonst drückt die heiße Düse nach dem Wischen weiter
    # Filament heraus, das beim Abkühlen als Tropfen aushärtet (PETG!). Die
    # Purge-Linie am Druckstart gleicht das aus
    SAVE_GCODE_STATE NAME=_clean_nozzle
    M83
    G1 E-1 F1800
    RESTORE_GCODE_STATE NAME=_clean_nozzle

    # Heizung sofort zurück auf Ziel (Düse beginnt zu kühlen während Fahrt)
    M104 S{old_target}
    M106 P1 S255
    M106 S255
    M117 Schrubben...
    G90
    G0 X310 Y364 F9000
    G1 Z{wipe_z}

    {% for i in range(10 * passes) %}
        G0 X340 F15000
        G0 X310 F15000
    {% endfor %}

    # Beim Abkühlen weiterwischen, in Stufen: was nachläuft, kommt ab, solange
    # es noch weich ist (bei 150 °C ist es schon fest)
    {% set final = old_target + 2 if old_target > 0 else 150 %}
    {% for t in [240, 220, 200, 180] if t > final %}
        M117 Wischen bei {t}C...
        G0 Z{wipe_z + 2} F1200
        TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={t}
        G1 Z{wipe_z}
        {% for i in range(3) %}
            G0 X340 F15000
            G0 X310 F15000
        {% endfor %}
    {% endfor %}

    G0 X344 Y364 Z10 F9000
    M117 Kühlen auf {final}C...
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={final}

    _ALL_FAN_OFF
    # Erst als gereinigt markieren, dann mit sauberer Düse neu homen
    # (das Homing davor kann Filament an der Düse gemessen haben)
    _CLEAN_NOZZLE_DONE
    M117 Homing Z (Sauber)...
    # AUTO_CLEAN=0: liegt die Düse jetzt noch auf, Fehler statt erneut reinigen
    LOADCELL_HOME AUTO_CLEAN=0
    G1 Z10 F1200
    M117 Clean fertig.

[gcode_macro _CLEAN_NOZZLE_DONE]
gcode:
    SET_GCODE_VARIABLE MACRO=CLEAN_NOZZLE VARIABLE=last_clean VALUE={printer.toolhead.estimated_print_time}

[gcode_macro MAINTENANCE_CALIBRATE_Z]
description: Einmalige Basis-Kalibrierung mit Speichern (Löst Restart aus!) - TEMP=Drucktemperatur (Standard 220)
gcode:
    {% set temp = params.TEMP|default(220)|int %}
    _CG28
    _CQUAD_GANTRY_LEVEL
    _CG28 AXES=Z
    CLEAN_NOZZLE MAX_AGE=0
    # Messen bei Drucktemperatur wie in START_PRINT (Düse dehnt sich aus)
    M109 S{temp}
    # MAX_OFFSET großzügig: bei der Kalibrierung kann position_endstop noch weit daneben liegen
    AUTO_Z_OFFSET MAX_OFFSET=5
    M104 S0
    # Gemessenen Offset in stepper_z position_endstop übernehmen
    Z_OFFSET_APPLY_ENDSTOP
    SAVE_CONFIG

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BED_MESH_CALIBRATE_BASE
gcode:
    _CQUAD_GANTRY_LEVEL
    BED_MESH_CALIBRATE_BASE {rawparams}

#####################################################################
#   Fan Control Wrappers
#####################################################################

[gcode_macro _ALL_FAN_OFF]
gcode:
    M106 S0
    M107
    SET_FAN_SPEED FAN=aux_fan SPEED=0
    SET_FAN_SPEED FAN=exhaust_fan SPEED=0

[gcode_macro M106]
rename_existing: M106.1
description: M106 P0 = vorderer Bauteillüfter, P1/P2 = hinterer (aux_fan), P3 = Abluft
gcode:
    {% set fan = params.P|default(0)|int %}
    {% set speed = params.S|default(255)|int %}
    
    {% if fan == 0 %}
        M106.1 S{speed}
    {% elif fan == 1 or fan == 2 %}
        SET_FAN_SPEED FAN=aux_fan SPEED={speed / 255.0}
    {% elif fan == 3 %}
        SET_FAN_SPEED FAN=exhaust_fan SPEED={speed / 255.0}
    {% endif %}

[gcode_macro M107]
rename_existing: M107.1
description: Schaltet Lüfter aus
gcode:
    {% set fan = params.P|default(-1)|int %}
    {% if fan == 0 %}
        M107.1
    {% elif fan == 1 or fan == 2 %}
        SET_FAN_SPEED FAN=aux_fan SPEED=0
    {% elif fan == 3 %}
        SET_FAN_SPEED FAN=exhaust_fan SPEED=0
    {% else %}
        M107.1
        SET_FAN_SPEED FAN=aux_fan SPEED=0
    {% endif %}

[gcode_macro PRINT_START]
description: Alias für START_PRINT (leitet alle Parameter weiter)
gcode:
    START_PRINT {rawparams}

#####################################################################
#   Filament
#####################################################################

[gcode_macro M600]
description: Filamentwechsel - pausiert mit Parken, weiter mit RESUME
gcode:
    {action_respond_info("Filamentwechsel: Filament tauschen, dann RESUME")}
    PAUSE

[gcode_macro LOAD_FILAMENT_SLOW]
description: Load filament slowly
gcode:
    {% set temp = 220 %}
    {% if printer.extruder.temperature < temp %}
        M117 Heating nozzle...
        M109 S{temp}
    {% endif %}
    M117 Loading filament slow
    M83
    G92 E0
    G1 E30 F300
    G1 E40 F200
    M117 Filament loaded

[gcode_macro LOAD_FILAMENT_FAST]
description: Load filament fast
gcode:
    {% set temp = 220 %}
    {% if printer.extruder.temperature < temp %}
        M117 Heating nozzle...
        M109 S{temp}
    {% endif %}
    M117 Loading filament fast
    M83
    G92 E0
    G1 E80 F1500
    G1 E40 F400
    M117 Filament loaded

[gcode_macro UNLOAD_FILAMENT_SLOW]
description: Unload filament
gcode:
    {% set temp = 220 %}
    {% if printer.extruder.temperature < temp %}
        M117 Heating nozzle...
        M109 S{temp}
    {% endif %}
    M117 Unloading filament
    M83
    G92 E0
    G1 E10 F300
    G1 E-80 F1200
    M117 Filament unloaded

[gcode_macro UNLOAD_FILAMENT_FAST]
description: Unload filament fast
gcode:
    {% set temp = 220 %}
    {% if printer.extruder.temperature < temp %}
        M117 Heating nozzle...
        M109 S{temp}
    {% endif %}
    M117 Fast filament unload
    M83
    G92 E0
    G1 E10 F400
    G1 E-120 F3000
    M117 Filament removed
