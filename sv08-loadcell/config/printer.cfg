# Sovol SV08 - Mainline-Klipper mit Wägezellen-Homing (sv08-loadcell)
# Diese Datei gehört dir: gerätespezifische Werte, wird von Updates NICHT überschrieben.
# sv08-*.cfg sind Symlinks ins Repo und kommen mit Updates - dort nichts ändern,
# eigene Anpassungen hier unten eintragen (gleichnamige Sektion/Option überschreibt).

[include mainsail.cfg]
[include timelapse.cfg]
[include sv08-macros.cfg]
[include sv08-loadcell.cfg]
[include sv08-menu.cfg]

[mcu]      
serial: __MCU_SERIAL__
restart_method: command     

[mcu extra_mcu]
serial: __EXTRA_MCU_SERIAL__
restart_method: command      


[adxl345]
cs_pin:extra_mcu:PB12

[exclude_object]

[resonance_tester]
accel_chip: adxl345
probe_points:
    175, 175, 30

[temperature_sensor mcu_temp]         
sensor_type: temperature_mcu
min_temp:0
max_temp:100

[temperature_sensor Host_temp]     
sensor_type: temperature_host
min_temp: 0
max_temp: 100

[temperature_sensor Toolhead_Temp]
sensor_type: temperature_mcu
sensor_mcu: extra_mcu
min_temp: 0
max_temp: 100

[pause_resume]

[printer]
kinematics: corexy           
max_velocity: 700            
max_accel: 15000
max_z_velocity: 100
max_z_accel: 500             
square_corner_velocity: 5.0  

[probe]
pin: extra_mcu:PB6    
x_offset: -17                  
y_offset: 10             
# z_offset ist für Z egal (gehomt wird auf der Wägezelle), gilt nur für PROBE-Ausgaben
z_offset: 1.85
# Sweet Spot aus Testreihe (range 0,0028 / stddev 0,0010 mm). Nie >= 70 mm/s: Z verliert Schritte
speed: 30
samples: 3
sample_retract_dist: 5
lift_speed: 25
samples_tolerance: 0.015
samples_tolerance_retries: 9

[bed_mesh]
speed: 500                   
# Mesh ist an diesem Punkt 0 = Bettposition von AUTO_Z_OFFSET ([sv08_loadcell] nimmt sie von hier).
# Nahe an der Wägezelle (Probe über Zelle bei 289,361), damit Gantry-Schräge/Bettwölbung nicht in den Offset eingehen
zero_reference_position: 289,340
# Anfahrweg jedes Mesh-Punkts = Probe-z_offset + sample_retract_dist (wie in der Messreihe);
# CALIBRATE_SV08 setzt den Wert passend zum ermittelten Rückzug
horizontal_move_z: 7
mesh_min: 1.5, 10.5
mesh_max: 338,349
probe_count: 9,9
algorithm: bicubic
adaptive_margin: 5
faulty_region_1_min: 0,0
faulty_region_1_max: 12,355

[quad_gantry_level]          
gantry_corners:              
	-60,-10
	410,420
points:
	36,10
	36,320
	346,320
	346,10
speed: 500
horizontal_move_z: 10       
retry_tolerance: 0.030
retries: 5                  
max_adjust: 30              

[sv08_loadcell]
# Korrektur Zelle/PEI: die induktive Probe löst über dem Metall der Zelle näher aus als über PEI.
# Startwert vom Referenzgerät - CALIBRATE_SV08 bestimmt den eigenen Wert (Papiertest) und speichert ihn
z_correction: 1.16

[stepper_x]
step_pin: PE2
dir_pin: !PE0
enable_pin: !PE3
rotation_distance: 40         
microsteps: 16                
full_steps_per_rotation:200   
endstop_pin: tmc2209_stepper_x: virtual_endstop              
position_min: 0               
position_endstop: 0
position_max: 356
homing_speed: 50
homing_retract_dist: 0
homing_positive_dir: false
[tmc2209 stepper_x]
uart_pin: PE1
run_current: 1.4
sense_resistor: 0.150         
uart_address:3
driver_sgthrs: 100
diag_pin: PE15

[stepper_y]
step_pin: PB8
dir_pin: !PB6
enable_pin: !PB9
rotation_distance: 40         
microsteps: 16                
full_steps_per_rotation:200   
endstop_pin: tmc2209_stepper_y: virtual_endstop              
position_min: 0               
position_endstop: 0
position_max: 364            
homing_speed: 50
homing_retract_dist: 0
homing_positive_dir: false
[tmc2209 stepper_y]
uart_pin: PB7
run_current: 1.4
sense_resistor: 0.150         
uart_address:3
driver_sgthrs: 100
diag_pin: PE13 

[stepper_z] #motherboard：Z3 
step_pin:PC0    
dir_pin:PE5    
enable_pin:!PC1    
rotation_distance: 40         
gear_ratio: 80:12             
microsteps: 32
# Z-Endstop = Wägezelle hinten rechts (Düse drückt bei X289 Y361). Homing macht LOADCELL_HOME
# ([sv08_loadcell], aufgerufen aus [homing_override]) - homing_speed/retract hier daher nicht gesetzt
endstop_pin: ^!PE12
# Startwert - CALIBRATE_SV08 misst den echten Wert und speichert ihn per SAVE_CONFIG
position_endstop: 0
position_max: 347             
position_min: -5              
[tmc2209 stepper_z]
uart_pin: PE6 
run_current: 0.8           
sense_resistor: 0.150         
uart_address:3

[stepper_z1] ##motherboard：Z1
step_pin:PD3  
dir_pin:!PD1 
enable_pin:!PD4 
rotation_distance: 40         
gear_ratio: 80:12            
microsteps: 32
[tmc2209 stepper_z1]
uart_pin:PD2  
run_current:  0.8
sense_resistor: 0.150         
uart_address:3

[stepper_z2] ##motherboard：Z2
step_pin:PD7
dir_pin:PD5   
enable_pin:!PB5
rotation_distance: 40         
gear_ratio: 80:12             
microsteps: 32
[tmc2209 stepper_z2]
uart_pin:PD6  
run_current: 0.8
sense_resistor: 0.150         
uart_address:3

[stepper_z3] ##motherboard：Z4
step_pin:PD11 
dir_pin:!PD9 
enable_pin:!PD12   
rotation_distance: 40         
gear_ratio: 80:12             
microsteps: 32
[tmc2209 stepper_z3]
uart_pin:PD10    
run_current: 0.8
sense_resistor: 0.150         
uart_address:3

[thermistor my_thermistor_e]
temperature1:25
resistance1:110000
temperature2:100
resistance2:7008
temperature3:220
resistance3:435

[extruder]
step_pin: extra_mcu:PA8   
dir_pin: extra_mcu:PB8    
enable_pin:!extra_mcu: PB11   
rotation_distance: 6.5 
microsteps: 16
full_steps_per_rotation: 200 
nozzle_diameter: 0.400        
filament_diameter: 1.75  
max_extrude_only_distance: 150     
heater_pin:extra_mcu:PB9  
sensor_type:my_thermistor_e  
pullup_resistor: 11500
sensor_pin: extra_mcu:PA5  
min_temp: 5                  
max_temp: 305                 
max_power: 1.0                
min_extrude_temp: 170
control : pid
pid_kp : 33.838
pid_ki : 5.223
pid_kd : 47.752
pressure_advance: 0.025       
pressure_advance_smooth_time: 0.03

[tmc2209 extruder]
uart_pin: extra_mcu:PB10  
run_current: 0.66
uart_address:3
sense_resistor: 0.150          

[verify_heater extruder]      
max_error: 120                
check_gain_time:30           
hysteresis: 5                
heating_gain: 2               

[filament_switch_sensor filament_sensor]
pause_on_runout: True
event_delay: 3.0
pause_delay: 0.5
switch_pin: PE9

[thermistor my_thermistor]
temperature1:25
resistance1:100000
temperature2:50
resistance2:18085.4
temperature3:100
resistance3:5362.6

[heater_bed]
heater_pin:PA0
sensor_type: my_thermistor  
sensor_pin: PC5
max_power: 1.0               
min_temp: 5                  
max_temp: 105                
control : pid
pid_kp : 73.571
pid_ki : 1.820
pid_kd : 783.849

[verify_heater heater_bed]      
max_error: 120                
check_gain_time:40           
hysteresis: 5                
heating_gain: 2 

# Bauteillüfter getrennt: hinten = aux_fan (M106 P1/P2), vorne = fan (M106 / M106 P0)
[fan_generic aux_fan] # back model cooling fan
pin: extra_mcu:PA7
max_power: 1.0

[fan] # front model cooling fan
pin: extra_mcu:PB1
max_power: 1.0

[fan_generic exhaust_fan] # Abluftlüfter (M106 P3)
pin: PA2
max_power: 1.0

[temperature_fan MCU_fan]
pin: PA1
kick_start_time: 0.5
max_power: 1.0
min_temp: 0
max_temp: 90
off_below: 0.3
#hardware_pwm: true
target_temp: 65
sensor_type: temperature_host
max_speed: 1.0
min_speed: 0.1
control: pid
pid_kp: 2.0
pid_ki: 5.0
pid_kd: 0.5
pid_deriv_time: 2.0

[heater_fan hotend_fan]      
pin: extra_mcu:PA6   
max_power: 1.0               
kick_start_time: 0.5         
heater: extruder             
heater_temp: 50
tachometer_pin:extra_mcu:PA1
tachometer_ppr: 1
tachometer_poll_interval: 0.0013

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PA8,   EXP1_2=PC9,
    EXP1_3=PA10,  EXP1_4=PA9,
    EXP1_5=PC11,  EXP1_6=PC10,
    EXP1_7=PD8,   EXP1_8=PC12,
    EXP1_9=<GND>, EXP1_10=<5V>,

    # EXP2 header
    EXP2_1=PB14,  EXP2_2=PB13,
    EXP2_3=PC7,   EXP2_4=PB12,
    EXP2_5=PC6,   EXP2_6=PB15,
    EXP2_7=PC8,   EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=<5V>

[display]                    
lcd_type: uc1701
cs_pin: EXP1_3
a0_pin: EXP1_4
rst_pin: EXP1_5
encoder_pins: ^EXP2_5, ^EXP2_3
click_pin: ^!EXP1_2
contrast: 63
spi_software_miso_pin: EXP2_1
spi_software_mosi_pin: EXP2_6
spi_software_sclk_pin: EXP2_2

[output_pin beeper]
pin: EXP1_1
pwm: False
value: 0

[neopixel Screen_Colour]     
pin: EXP1_6
chain_count: 3
color_order: RGB             
initial_RED: 0.5             
initial_GREEN: 0.4           
initial_BLUE: 0.7           

[gcode_arcs]                       

[output_pin main_led]
pin:PA3
pwm: 1
value:1
cycle_time: 3

[idle_timeout]
gcode: _IDLE_TIMEOUT
timeout: 600

[save_variables]
filename: ~/printer_data/config/saved_variables.cfg

# --- Eigene Anpassungen ab hier ---
